<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=dashboard/">
  <title>Rally Studio · Redireccionando</title>
  <link rel="icon" type="image/svg+xml" href="dashboard/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      text-align: center;
      padding-top: 80px;
      background-color: #FFFFFF;
      color: #0D1B35;
      margin: 0;
    }
    .brand-logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
    }
    .brand-slash {
      color: #0066FF;
      margin-right: 6px;
      font-family: 'JetBrains Mono', monospace;
    }
    .brand-rally {
      color: #091E42;
    }
    .brand-studio {
      color: #0066FF;
      margin-left: 5px;
    }
    .redirect-msg {
      font-size: 14px;
      color: #5C7193;
      margin-bottom: 16px;
    }
    .redirect-link {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      color: #0866F5;
      text-decoration: none;
      padding: 8px 16px;
      border: 1px solid #DCE7F5;
      border-radius: 8px;
      transition: background 120ms;
    }
    .redirect-link:hover {
      background-color: #F8FAFD;
    }
  </style>
  <script>window.location.replace("dashboard/");</script>
</head>
<body>
  <div class="brand-logo">
    <span class="brand-slash">//</span><span class="brand-rally">RALLY</span><span class="brand-studio">STUDIO</span>
  </div>
  <p class="redirect-msg">Iniciando Workbench de Innovación...</p>
  <p><a href="dashboard/" class="redirect-link">Continuar al Dashboard</a></p>
</body>
</html>
