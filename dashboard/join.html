<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar al proyecto · Rally Studio</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261019_rev10">
  <style>
    .join-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg, #f6f4ef);
    }
    .join-card {
      width: min(440px, 100%);
      background: var(--surface, #fff);
      border: 1px solid var(--line, #d9d4c8);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 18px 40px rgba(20, 24, 28, .08);
    }
    .join-card h1 {
      font-size: 24px;
      line-height: 1.2;
      margin: 0 0 8px;
    }
    .join-card p { margin: 0 0 20px; color: var(--muted, #5c625f); line-height: 1.5; }
    .join-card label { display: block; font-weight: 700; margin-bottom: 8px; }
    .join-card input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line, #d9d4c8);
      border-radius: 8px;
      font: inherit;
      background: var(--bg, #f6f4ef);
      color: inherit;
    }
    .join-card input:focus { outline: 2px solid var(--accent, #1f6f5c); outline-offset: 2px; }
    .join-card button {
      width: 100%;
      margin-top: 16px;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      background: var(--accent, #1f6f5c);
      color: #fff;
    }
    .join-card button:disabled { opacity: .6; cursor: wait; }
    #join-status { margin: 16px 0 0; min-height: 20px; color: var(--danger, #a3341f); }
  </style>
</head>
<body>
  <main class="join-shell">
    <section class="join-card">
      <h1>Entrar al proyecto</h1>
      <p>Este enlace es personal. Escribe el nombre con el que vas a aparecer en el trabajo del equipo.</p>
      <form id="join-form" novalidate>
        <label for="join-name">Tu nombre</label>
        <input id="join-name" name="name" type="text" maxlength="40" autocomplete="name" required>
        <button id="join-submit" type="submit">Entrar</button>
        <p id="join-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="join.js?v=20261019_rev12" defer></script>
</body>
</html>
